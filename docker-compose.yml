version: '3.9'
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/shop
      - NODE_ENV=production
    depends_on:
      - mongo
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=shop
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
